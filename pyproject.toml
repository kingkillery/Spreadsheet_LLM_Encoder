[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsheet-llm-encoder"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openpyxl",
    "pandas",
    "streamlit"
]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.7.0"]
openai = ["openai>=1.0"]
finetune = [
    "datasets>=2.14",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.28"
]
qlora = ["bitsandbytes>=0.43"]
baselines = ["transformers>=4.40"]
all = [
    "tiktoken>=0.7.0",
    "openai>=1.0",
    "datasets>=2.14",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.28"
]

[project.scripts]
spreadsheet-llm-encode = "Spreadsheet_LLM_Encoder:main"

[tool.setuptools]
py-modules = [
    "Spreadsheet_LLM_Encoder",
    "app_helpers",
    "baselines",
    "chain_of_spreadsheet",
    "evaluation",
    "evaluation_metadata",
    "llm_backend",
    "paper_serializers",
    "prepare_finetuning_data",
    "streamlit_app",
    "temp_helpers",
    "tokenizer"
]
